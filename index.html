<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkFlow · Book Publishing Workflow System</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    let savedTheme = localStorage.getItem('inkflow.theme');
    let prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>

  <header class="site-header">
    <a class="brand" href="#/dashboard" aria-label="InkFlow home">
      <svg viewBox="0 0 32 32" width="34" height="34">
        <rect width="32" height="32" rx="8" fill="currentColor" opacity=".14"/>
        <path d="M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M13 14h6M13 18h6" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">
        <strong>InkFlow</strong>
        <small>Publishing Workflow</small>
      </span>
    </a>

    <button type="button" class="nav-toggle" data-action="toggle-nav" aria-expanded="false" aria-controls="mainnav">☰ Menu</button>

    <nav id="mainnav" aria-label="Main">
      <a href="#/dashboard">Dashboard</a>
      <a href="#/board">Board</a>
      <a href="#/manuscripts">Manuscripts</a>
      <a href="#/authors">Authors</a>
      <a href="#/editors">Editors</a>
    </nav>

    <div class="header-tools">
      <label class="acting" for="actingAs">
        <span class="sr-only">Signed in as</span>
        <span id="roleBadge" class="role-badge"></span>
        <select id="actingAs" aria-label="Acting as"></select>
      </label>
      <button type="button" id="themeToggle" class="icon-btn" data-action="toggle-theme" aria-label="Toggle dark mode" aria-pressed="false">☾</button>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p class="empty">InkFlow needs JavaScript to run.</p></noscript>
  </main>

  <footer class="site-footer">
    <p>InkFlow · Book Publishing Workflow System</p>
  </footer>

  <dialog id="modal" aria-label="Dialog"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
