<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkFlow · Book Publishing Workflow System</title>
  <meta name="description" content="InkFlow tracks book manuscripts through submission, editing, proofreading, cover design, review, approval and publication.">
  <meta name="theme-color" content="#1b2a41">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2a41'/%3E%3Cpath d='M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3z' fill='none' stroke='%23f4d6a0' stroke-width='2'/%3E%3Cpath d='M13 14h6M13 18h6' stroke='%23c8553d' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try {
      let theme = localStorage.getItem('inkflow.theme');
      if (!theme) {
        let prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        theme = prefersDark ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>

  <header class="site-header">
    <a class="brand" href="#/dashboard" aria-label="InkFlow home">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="currentColor" opacity=".14"/>
        <path d="M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M13 14h6M13 18h6" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-text"><strong>InkFlow</strong><small>Publishing Workflow</small></span>
    </a>

    <button class="nav-toggle" data-action="toggle-nav" aria-expanded="false" aria-controls="mainnav">☰ Menu</button>

    <nav id="mainnav" aria-label="Main">
      <a href="#/dashboard">Dashboard</a>
      <a href="#/board">Board</a>
      <a href="#/manuscripts">Manuscripts</a>
      <a href="#/authors">Authors</a>
      <a href="#/editors">Editors</a>
    </nav>

    <div class="header-tools">
      <label class="acting" for="actingAs"><span class="sr-only">Signed in as</span>
        <span id="roleBadge" class="role-badge"></span>
        <select id="actingAs" aria-label="Acting as"></select>
      </label>
      <button id="themeToggle" class="icon-btn" data-action="toggle-theme" aria-label="Toggle dark mode" aria-pressed="false">☾</button>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="off">
    <noscript><p class="empty">InkFlow needs JavaScript to run.</p></noscript>
  </main>

  <footer class="site-footer">
    <p>InkFlow · Book Publishing Workflow System — a CA project built with HTML, CSS and vanilla JavaScript. Data is stored in your browser only.</p>
    <p class="footer-tools">
      <button class="link-btn" data-action="export">Export data (JSON)</button>
      <button class="link-btn" data-action="import">Import data</button>
      <button class="link-btn" data-action="reset">Reset demo data</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </p>
  </footer>

  <dialog id="modal" aria-label="Dialog"></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
